<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiTwist AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    height:100vh;
    background:#0f172a;
    color:white;
}

.sidebar{
    width:280px;
    background:#111827;
    border-right:1px solid #333;
    display:flex;
    flex-direction:column;
    padding:15px;
}

.new-chat{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
    margin-bottom:20px;
}

.new-chat:hover{
    background:#1d4ed8;
}

.history{
    flex:1;
    overflow-y:auto;
}

.history-item{
    padding:12px;
    background:#1f2937;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.history-item:hover{
    background:#374151;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:0 25px;
    border-bottom:1px solid #333;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#60a5fa;
}

.chat-container{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:75%;
    padding:12px 15px;
    border-radius:12px;
    margin:10px 0;
    word-wrap:break-word;
}

.user{
    background:#2563eb;
    margin-left:auto;
}

.ai{
    background:#1e293b;
}
  .input-area{
    display:flex;
    padding:15px;
    border-top:1px solid #333;
}

input{
    flex:1;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    font-size:16px;
}

button.send{
    margin-left:10px;
    padding:14px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button.send:hover{
    background:#1d4ed8;
}
/* ==========================
   MOBILE RESPONSIVE
========================== */

@media (max-width: 768px){

body{
    flex-direction:column;
}

.sidebar{
    position:fixed;
    left:-280px;
    top:0;
    width:260px;
    height:100%;
    z-index:999;
    transition:.3s;
}

.sidebar.show{
    left:0;
}

.main{
    width:100%;
}

.header{
    justify-content:space-between;
    padding:12px;
}

.logo{
    font-size:20px;
}

.chat-container{
    padding:12px;
}

.message{
    max-width:95%;
    font-size:15px;
}

.input-area{
    padding:10px;
}

input{
    font-size:16px;
    padding:12px;
}

button.send{
    padding:12px 16px;
    font-size:15px;
}

.history-item{
    font-size:14px;
}

}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">

    <button class="new-chat" onclick="newChat()">
        + New Chat
    </button>

    <div class="history" id="history">

    </div>

</div>

<div class="main">

 <div class="header">

    <div onclick="toggleSidebar()" style="font-size:28px;cursor:pointer;">
        ☰
    </div>

    <div class="logo">
        MultiTwist
    </div>

</div>

    <div class="chat-container" id="chat">

    </div>

    <div class="input-area">
<input
    id="userInput"
    type="text"
    placeholder="Ask MultiTwist anything..."
>

<input
    type="file"
    id="imageInput"
    accept="image/*"
>

<button
    class="send"
    onclick="sendMessage()"
>
    Send
</button>

    </div>

</div>

<script>

let chats =
JSON.parse(localStorage.getItem("multitwistChats"))
|| [];

let currentChat = null;

function saveChats(){

    localStorage.setItem(
        "multitwistChats",
        JSON.stringify(chats)
    );

}
 
function loadHistory(){

    const history = document.getElementById("history");
    history.innerHTML = "";

    chats.forEach((chat,index)=>{

        const item = document.createElement("div");
        item.className = "history-item";

        const title = document.createElement("span");
        title.innerText = chat.title;

        // Double-click to rename
        title.ondblclick = function(){

            const newName = prompt("Rename chat:", chat.title);

            if(newName && newName.trim() !== ""){

                chat.title = newName;

                saveChats();

                loadHistory();

            }

        };

        // Delete button
        const del = document.createElement("button");
        del.innerHTML = "🗑️";

        del.style.float = "right";
        del.style.background = "transparent";
        del.style.border = "none";
        del.style.cursor = "pointer";
        del.style.color = "white";

        del.onclick = function(e){

            e.stopPropagation();

            if(confirm("Delete this chat?")){

                chats.splice(index,1);

                if(chats.length===0){

                    currentChat=null;

                    newChat();

                }else{

                    currentChat=chats[0];

                }

                saveChats();

                loadHistory();

                renderChat();

            }

        };

        item.appendChild(title);
        item.appendChild(del);

        item.onclick = function(){

            openChat(index);

        };

        history.appendChild(item);

    });

}

function newChat(){

    const chatObject={

        title:"New Chat",

        messages:[]

    };

    chats.push(chatObject);

    currentChat=chatObject;

    saveChats();

    loadHistory();

    renderChat();

}

function openChat(index){

    currentChat=chats[index];

    renderChat();

}

function renderChat(){

    const chat=
    document.getElementById("chat");

    chat.innerHTML="";

    if(currentChat.messages.length===0){

        const hello=
        document.createElement("div");

        hello.className="message ai";

        hello.innerText=
        "Hello! I am MultiTwist AI. Ask me anything.";

        chat.appendChild(hello);

        return;

    }

    currentChat.messages.forEach(msg=>{

        const div=
        document.createElement("div");

        div.className=
        "message "+msg.sender;


        chat.appendChild(div);
const text = document.createElement("span");
text.innerText = msg.text;

div.appendChild(text);

if(msg.sender === "ai"){

    const copy = document.createElement("button");

    copy.innerHTML = "📋";

    copy.style.marginLeft = "10px";
    copy.style.background = "transparent";
    copy.style.border = "none";
    copy.style.cursor = "pointer";
    copy.style.fontSize = "16px";

    copy.onclick = function(){

        navigator.clipboard.writeText(msg.text);

        copy.innerHTML = "✅";

        setTimeout(function(){

            copy.innerHTML = "📋";

        },1000);

    };

    div.appendChild(copy);

}
    });

    chat.scrollTop=
    chat.scrollHeight;

}
    async function sendMessage(){

    const input = document.getElementById("userInput");
    const image = document.getElementById("imageInput").files[0];

    const text = input.value.trim();

    if(text === "" && !image) return;
    if(currentChat===null){

        newChat();

    }

    currentChat.messages.push({

        sender:"user",
        text:text

    });

    if(currentChat.title==="New Chat"){

        currentChat.title=text.substring(0,30);

    }

    renderChat();
    loadHistory();
    saveChats();

    input.value="";
document.getElementById("imageInput").value="";
    const chat=document.getElementById("chat");

    const thinking=document.createElement("div");

    thinking.className="message ai";
    thinking.innerText="Thinking...";

    chat.appendChild(thinking);

    chat.scrollTop=chat.scrollHeight;

    try{

      const formData = new FormData();

formData.append("message", text);

if(image){
    formData.append("image", image);
}

const response = await fetch("/chat",{
    method:"POST",
    body:formData
});

const data = await response.json();

        thinking.remove();

        currentChat.messages.push({

            sender:"ai",
            text:data.reply

        });

        renderChat();

        saveChats();

    }catch(err){

        thinking.innerText="Error contacting AI.";

    }

}

document.getElementById("userInput").addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        e.preventDefault();

        sendMessage();

    }

});

window.onload=function(){

    loadHistory();

    if(chats.length>0){

        currentChat=chats[0];

    }else{

        newChat();

    }

    renderChat();

};
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("show");
}
</script>

</body>
</html>
